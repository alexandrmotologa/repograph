<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="amber-beak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.14" />
    </filter>

    <filter id="eye-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f5ff" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <!-- Inner Telemetry Dashed Accent -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Graph Hub Vertices on Hexagon Corners -->
      <g>
        <!-- Vertex Top (0, -390) -->
        <circle cx="0" cy="-390" r="14" fill="#0f172a" stroke="#00f5ff" stroke-width="4"/>
        <circle cx="0" cy="-390" r="5" fill="#00f5ff"/>

        <!-- Vertex Top Right (338, -195) -->
        <circle cx="338" cy="-195" r="14" fill="#0f172a" stroke="#00f5ff" stroke-width="4"/>
        <circle cx="338" cy="-195" r="5" fill="#00f5ff"/>

        <!-- Vertex Bottom Right (338, 195) -->
        <circle cx="338" cy="195" r="14" fill="#0f172a" stroke="#00f5ff" stroke-width="4"/>
        <circle cx="338" cy="195" r="5" fill="#00f5ff"/>

        <!-- Vertex Bottom (0, 390) -->
        <circle cx="0" cy="390" r="14" fill="#0f172a" stroke="#00f5ff" stroke-width="4"/>
        <circle cx="0" cy="390" r="5" fill="#00f5ff"/>

        <!-- Vertex Bottom Left (-338, 195) -->
        <circle cx="-338" cy="195" r="14" fill="#0f172a" stroke="#00f5ff" stroke-width="4"/>
        <circle cx="-338" cy="195" r="5" fill="#00f5ff"/>

        <!-- Vertex Top Left (-338, -195) -->
        <circle cx="-338" cy="-195" r="14" fill="#0f172a" stroke="#00f5ff" stroke-width="4"/>
        <circle cx="-338" cy="-195" r="5" fill="#00f5ff"/>
      </g>

      <!-- ============================================================= -->
      <!-- THE SENTINEL OWL (ATHENE NOCTUA) - APEX CODEBASE NAVIGATOR    -->
      <!-- ============================================================= -->

      <!-- Tail Fan / Perch Foundation -->
      <polygon points="0,260 -75,335 0,360" fill="#1e293b"/>
      <polygon points="0,260 0,360 75,335" fill="#0f172a"/>
      <polygon points="-75,335 -40,355 0,360" fill="#0f172a"/>
      <polygon points="75,335 0,360 40,355" fill="#090d16"/>

      <!-- Primary Outer Wings (Directional Call Vectors) -->
      <!-- Left Outer Wing -->
      <polygon points="-160,-20 -265,40 -205,130 -115,85" fill="#334155"/>
      <polygon points="-265,40 -285,160 -220,230 -165,175 -205,130" fill="#1e293b"/>
      <polygon points="-220,230 -185,305 -115,270 -135,210 -165,175" fill="#0f172a"/>

      <!-- Right Outer Wing (Symmetrical Shadowed) -->
      <polygon points="160,-20 115,85 205,130 265,40" fill="#1e293b"/>
      <polygon points="265,40 205,130 165,175 220,230 285,160" fill="#0f172a"/>
      <polygon points="220,230 165,175 135,210 115,270 185,305" fill="#090d16"/>

      <!-- Lower Body & Abdomen Armor Plates -->
      <polygon points="-45,125 -115,155 -95,245 0,265 0,185" fill="#1e293b"/>
      <polygon points="45,125 0,185 0,265 95,245 115,155" fill="#0f172a"/>

      <!-- Upper Chest Armor & Breastplate -->
      <polygon points="0,50 -55,90 0,145" fill="#475569"/>
      <polygon points="0,50 0,145 55,90" fill="#334155"/>
      <polygon points="-55,90 -115,85 -45,125 0,145" fill="#334155"/>
      <polygon points="55,90 0,145 45,125 115,85" fill="#1e293b"/>

      <!-- Central Cyan Telemetry Nexus Line -->
      <line x1="0" y1="50" x2="0" y2="265" stroke="#00f5ff" stroke-width="3.5" opacity="0.85"/>

      <!-- Core Chest Telemetry Diamond -->
      <polygon points="0,75 -35,125 0,175 35,125" fill="#0f172a" stroke="#00f5ff" stroke-width="2"/>
      <polygon points="0,95 -18,125 0,155 18,125" fill="url(#cyan-glow)"/>

      <!-- Head & Facial Disc Structure -->
      <!-- Alert Ear Tufts (Horns) -->
      <polygon points="-135,-285 -65,-195 -165,-175" fill="#334155"/>
      <polygon points="-135,-285 0,-205 -65,-195" fill="#475569"/>
      <polygon points="135,-285 65,-195 0,-205" fill="#1e293b"/>
      <polygon points="135,-285 165,-175 65,-195" fill="#0f172a"/>

      <!-- Forehead Crown Center -->
      <polygon points="0,-205 -65,-195 0,-125" fill="#475569"/>
      <polygon points="0,-205 0,-125 65,-195" fill="#334155"/>

      <!-- Upper Brow & Eye Sockets Frame -->
      <polygon points="-65,-195 -165,-175 -135,-115 -50,-115" fill="#334155"/>
      <polygon points="65,-195 50,-115 135,-115 165,-175" fill="#1e293b"/>

      <!-- Facial Disc Cheeks (Unmistakable Owl Anatomy) -->
      <polygon points="-165,-175 -205,-95 -175,-25 -135,-115" fill="#1e293b"/>
      <polygon points="165,-175 135,-115 175,-25 205,-95" fill="#0f172a"/>
      <polygon points="-175,-25 -95,35 -50,-65 -135,-115" fill="#0f172a"/>
      <polygon points="175,-25 135,-115 50,-65 95,35" fill="#090d16"/>

      <!-- Piercing Electric Cyan Optics (The Eyes) -->
      <!-- Left Ocular Socket -->
      <polygon points="-130,-75 -105,-102 -60,-102 -42,-75 -65,-48 -110,-48" fill="#0b0f19" stroke="#00f5ff" stroke-width="2.5"/>
      <circle cx="-85" cy="-75" r="23" fill="url(#cyan-glow)" filter="url(#eye-glow)"/>
      <circle cx="-85" cy="-75" r="11" fill="#070a12"/>
      <circle cx="-79" cy="-81" r="4.5" fill="#ffffff"/>

      <!-- Right Ocular Socket -->
      <polygon points="130,-75 110,-48 65,-48 42,-75 60,-102 105,-102" fill="#0b0f19" stroke="#00f5ff" stroke-width="2.5"/>
      <circle cx="85" cy="-75" r="23" fill="url(#cyan-glow)" filter="url(#eye-glow)"/>
      <circle cx="85" cy="-75" r="11" fill="#070a12"/>
      <circle cx="91" cy="-81" r="4.5" fill="#ffffff"/>

      <!-- Sharp Hooked Raptor Beak -->
      <polygon points="0,-125 -28,-65 0,-20" fill="#fbbf24"/>
      <polygon points="0,-125 0,-20 28,-65" fill="#d97706"/>
      <polygon points="0,-20 -22,12 0,48" fill="#f59e0b"/>
      <polygon points="0,-20 0,48 22,12" fill="#b45309"/>

      <!-- Talons / Perch Claws on Lower Gateway -->
      <!-- Left Talon -->
      <polygon points="-55,305 -40,320 -25,305 -40,295" fill="#f59e0b"/>
      <circle cx="-40" cy="320" r="5" fill="#fbbf24"/>
      <!-- Right Talon -->
      <polygon points="25,305 40,320 55,305 40,295" fill="#d97706"/>
      <circle cx="40" cy="320" r="5" fill="#f59e0b"/>

    </g>
  </g>
</svg>